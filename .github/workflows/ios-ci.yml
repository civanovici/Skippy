name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project Skippy/Skippy.xcodeproj \
            -scheme Skippy \
            -destination 'platform=iOS Simulator,name=iPhone SE (3rd generation)' \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit Tests
        run: |
          xcodebuild \
            -project Skippy/Skippy.xcodeproj \
            -scheme Skippy \
            -destination 'platform=iOS Simulator,name=iPhone SE (3rd generation)' \
            -only-testing:SkippyTests \
            test \
            CODE_SIGNING_ALLOWED=NO
